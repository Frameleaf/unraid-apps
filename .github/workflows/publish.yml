name: Publish catalog
# Keeps the catalog on the newest signed Frameleaf Manager release without a manual run.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      manager-tag:
        description: Rebuild a specific Manager release (blank = newest, skipped if already published)
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: publish-catalog
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Frameleaf/unraid-apps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MANAGER_TAG: ${{ inputs['manager-tag'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - id: publish
        run: scripts/publish.sh
      - name: Commit the refreshed catalog
        if: steps.publish.outputs.tag != ''
        env:
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "No catalog changes"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "Publish Frameleaf Manager ${TAG#manager-v} catalog"
          git push
