name: Publish catalog
# Keeps the catalog on the newest signed Frameleaf Manager and application releases without a manual run.
# Runs on Forgejo (code.heroapps.ca). GitHub stays the public source Community Applications reads,
# so the job rebuilds from GitHub's main, pushes the result there, then mirrors it back to Forgejo.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      manager-tag:
        description: Rebuild a specific Manager release (blank = newest, skipped if already published)
        type: string
        default: ''
      application-tag:
        description: Rebuild the Server/ML templates from a specific Frameleaf release (blank = newest)
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: publish-catalog
  cancel-in-progress: false
jobs:
  publish:
    if: github.server_url != 'https://github.com' && github.repository == 'Frameleaf/unraid-apps' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_PUBLISH_TOKEN }}
      MANAGER_TAG: ${{ inputs['manager-tag'] }}
      APPLICATION_TAG: ${{ inputs['application-tag'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Start from GitHub main
        run: |
          set -euo pipefail
          # The token goes on each command, never into .git/config.
          gh_git() { git -c "http.extraheader=Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" "$@"; }
          gh_git fetch -q https://github.com/Frameleaf/unraid-apps.git main
          git reset -q --hard FETCH_HEAD
      - id: publish
        run: scripts/publish.sh
      - name: Commit the refreshed catalog
        if: steps.publish.outputs.tag != ''
        env:
          TAG: ${{ steps.publish.outputs.tag }}
          APP_TAG: ${{ steps.publish.outputs.app_tag }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then echo "No catalog changes"; exit 0; fi
          git config user.name 'forgejo-actions'
          git config user.email 'forgejo-actions@noreply.code.heroapps.ca'
          git commit -qm "Publish Frameleaf Manager ${TAG#manager-v} and Frameleaf ${APP_TAG#frameleaf-v} catalog"
          gh_git() { git -c "http.extraheader=Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" "$@"; }
          gh_git push https://github.com/Frameleaf/unraid-apps.git HEAD:refs/heads/main
      - name: Mirror main to Forgejo
        # GitHub is the source of truth, so Forgejo's main simply follows it.
        # Push what GitHub has now, not this run's earlier snapshot, and only over the Forgejo tip just read.
        run: |
          set -euo pipefail
          gh_git() { git -c "http.extraheader=Authorization: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" "$@"; }
          seen=$(git ls-remote origin refs/heads/main | cut -f1)
          gh_git fetch -q https://github.com/Frameleaf/unraid-apps.git main
          git push --force-with-lease="refs/heads/main:${seen}" origin FETCH_HEAD:refs/heads/main
